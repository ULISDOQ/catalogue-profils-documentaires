# Profil expérimental générique Fournisseur-EXP-01. Reconnaissance non discriminante ; non qualifié.
issuer: Fournisseur-EXP-01
keywords:
  - '(?i)FACTURE'
fields:
  invoice_number: '(?i)FACTURE\s*N[°o.]?\s*([A-Z0-9-]+)'
  date: '(?i)FACTURE\s*N[°o.]?\s*[A-Z0-9-]+\s*DU\s*(\d{2}/\d{2}/\d{4})'
  amount: '(?i)Montant\s+factur[eé]\s*\([^)]+\)\s*(\d+[,.]\d{2})'
required_fields:
  - invoice_number
  - date
  - amount
options:
  currency: EUR
  decimal_separator: ','
  date_formats:
    - '%d/%m/%Y'
