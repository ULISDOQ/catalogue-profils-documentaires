# Adaptateur invoice2data candidat ; identifiant technique opaque, pas nom commercial.
# Sélection explicite du profil requise ; mot-cle FACTURE non discriminant.
# Voir documentation/architecture/IDENTITES_CORRESPONDANCES.md ; non qualifié.
issuer: ULISDOQ-ENTITY-EXP-0001
keywords:
  - '(?i)FACTURE'
fields:
  invoice_number: '(?i)FACTURE\s*N[°o.]?\s*([A-Z0-9-]+)'
  date: '(?i)FACTURE\s*N[°o.]?\s*[A-Z0-9-]+\s*DU\s*(\d{2}/\d{2}/\d{4})'
  amount: '(?i)Montant\s+factur[eé]\s*\([^)]+\)\s*(\d+[,.]\d{2})'
required_fields:
  - invoice_number
  - date
  - amount
options:
  currency: EUR
  decimal_separator: ','
  date_formats:
    - '%d/%m/%Y'
